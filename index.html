<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Charmify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241220;
    --panel:#3B1F35;
    --panel-2:#4A2740;
    --gold:#D4AF37;
    --gold-dark:#A6811F;
    --blush:#F3B6C4;
    --cream:#FBF6EE;
    --paper:#FFFFFF;
    --muted:#8C7A8A;
    --muted-dark:#C9B8C6;
    --line:#E7DCE4;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    background:var(--cream);
    font-family:'Manrope',sans-serif;
    color:var(--ink);
    min-height:100vh;
  }
  .display{ font-family:'Fraunces',serif; }
  .mono{ font-family:'IBM Plex Mono',monospace; }

  /* ===== HERO ===== */
  .hero{
    background:var(--panel);
    background-image: radial-gradient(circle at 20% 20%, var(--panel-2) 0%, transparent 55%);
    color:var(--cream);
    padding:44px 20px 56px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .hero-ring{
    width:46px; height:46px; border:4px solid var(--gold);
    border-radius:50%; margin:0 auto 18px;
    box-shadow:0 0 0 3px var(--panel), 0 2px 6px rgba(0,0,0,0.3);
  }
  .hero h1{
    font-size:clamp(34px,8vw,50px); font-weight:600; letter-spacing:0.5px;
    line-height:1.05;
  }
  .hero .sub{
    margin-top:12px; color:var(--muted-dark); font-size:14.5px;
    letter-spacing:0.5px; max-width:360px; margin-left:auto; margin-right:auto;
  }
  .hero-cta{
    display:inline-block; margin-top:24px; background:var(--gold); color:var(--ink);
    font-family:'Manrope',sans-serif; font-weight:700; font-size:14px;
    padding:13px 28px; border-radius:999px; border:none; cursor:pointer;
    letter-spacing:0.3px;
  }
  .hero-dm{
    margin-top:16px; font-size:12.5px; color:var(--muted-dark);
  }
  .hero-decor{
    position:absolute; pointer-events:none;
  }
  .hero-decor.sunflower-tl{ top:14px; left:12px; width:38px; opacity:0.85; transform:rotate(-12deg); }
  .hero-decor.sunflower-br{ bottom:10px; right:14px; width:46px; opacity:0.8; transform:rotate(18deg); }
  .hero-decor.sparkle-1{ top:38px; right:20%; width:16px; animation:twinkle 2.6s ease-in-out infinite; }
  .hero-decor.sparkle-2{ top:70%; left:14%; width:12px; animation:twinkle 2.2s ease-in-out infinite .6s; }
  .hero-decor.sparkle-3{ top:20px; left:34%; width:10px; animation:twinkle 3s ease-in-out infinite 1.1s; }
  @keyframes twinkle{
    0%, 100%{ opacity:0.35; transform:scale(0.85); }
    50%{ opacity:1; transform:scale(1.1); }
  }
  @media (prefers-reduced-motion: reduce){
    .hero-decor.sparkle-1, .hero-decor.sparkle-2, .hero-decor.sparkle-3{ animation:none; opacity:0.8; }
  }
  .hero.compact{ padding:20px 20px 24px; }
  .hero.compact .hero-ring{ width:30px; height:30px; border-width:3px; margin-bottom:10px; }
  .hero.compact h1{ font-size:24px; }
  .hero.compact .sub, .hero.compact .hero-cta, .hero.compact .hero-dm{ display:none; }

  .deco{ position:absolute; pointer-events:none; }
  .deco-sparkle{ color:var(--gold); }
  .hero.compact .deco{ display:none; }

  .wrap{ max-width:480px; margin:0 auto; padding:0 18px 130px; }
  @media (min-width:700px){ .wrap{ max-width:680px; } }
  @media (min-width:1100px){ .wrap{ max-width:920px; } }

  .screen{ display:none; }
  .screen.active{ display:block; animation:fadeIn .2s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .back-btn{
    display:inline-block; background:none; border:none; color:var(--panel);
    font-weight:700; font-size:13.5px; cursor:pointer; margin:22px 0 14px; padding:6px 0;
  }

  .section-title{
    font-family:'Fraunces',serif; font-weight:600; font-size:22px;
    margin:28px 0 16px; text-align:center; color:var(--ink);
  }

  /* ===== KEYRING CATEGORY NAV ===== */
  .keyring-nav{
    display:flex; align-items:center; gap:0; overflow-x:auto; padding:20px 4px 10px;
    -webkit-overflow-scrolling:touch;
  }
  .keyring-nav::-webkit-scrollbar{ display:none; }
  .key-link{
    width:22px; height:2px; background:repeating-linear-gradient(90deg, var(--gold-dark) 0 4px, transparent 4px 8px);
    flex-shrink:0;
  }
  .key-tab{
    flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:6px;
    background:none; border:none; cursor:pointer; padding:4px;
  }
  .key-tab .dot{
    width:52px; height:52px; border-radius:50%; background:var(--paper);
    border:2px solid var(--panel); display:flex; align-items:center; justify-content:center;
    font-size:22px;
  }
  .key-tab.active .dot{ background:var(--panel); border-color:var(--gold); }
  .key-tab .label{ font-size:10.5px; font-weight:700; color:var(--muted); white-space:nowrap; }
  .key-tab.active .label{ color:var(--ink); }

  /* ===== PRODUCT GRID ===== */
  .charm-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
    gap:18px; margin-top:6px;
  }
  .charm-card{
    background:var(--paper); border-radius:16px; padding:16px 14px 14px;
    position:relative; box-shadow:0 3px 0 var(--line);
    transition:transform .15s ease;
  }
  .charm-card:hover{ transform:rotate(-1deg) translateY(-2px); }
  .charm-hole{
    width:14px; height:14px; border-radius:50%; background:var(--cream);
    border:2px solid var(--ink); margin:0 auto 10px;
  }
  .charm-photo{
    width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:12px;
    background:var(--cream); display:block;
  }
  .charm-photo-placeholder{
    width:100%; aspect-ratio:1/1; border-radius:12px; background:var(--cream);
    display:flex; align-items:center; justify-content:center; font-size:26px; color:var(--muted);
  }
  .charm-name{
    font-weight:700; font-size:13.5px; margin-top:10px; line-height:1.25;
  }
  .charm-footer{
    display:flex; align-items:center; justify-content:space-between; margin-top:10px;
  }
  .price-tag{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12px;
    background:var(--blush); color:var(--ink); padding:3px 9px; border-radius:4px;
    transform:rotate(-3deg); display:inline-block;
  }
  .add-btn{
    background:var(--panel); color:var(--cream); border:none; border-radius:8px;
    padding:8px 14px; font-family:'Manrope',sans-serif; font-weight:700; font-size:12.5px;
    cursor:pointer; min-height:36px;
  }
  .add-btn.added{ background:var(--gold-dark); }
  .add-btn:disabled{ background:var(--muted); color:var(--paper); cursor:default; opacity:0.7; }
  .charm-photo-wrap{ position:relative; }
  .charm-card.sold-out .charm-photo{ filter:grayscale(70%); opacity:0.55; }
  .charm-card.sold-out .charm-photo-placeholder{ opacity:0.55; }
  .charm-card.sold-out .charm-name{ color:var(--muted); }
  .sold-out-badge{
    position:absolute; top:8px; left:8px; background:var(--ink); color:var(--cream);
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600;
    padding:3px 8px; border-radius:4px; letter-spacing:0.3px;
  }

  /* ===== CART BAR ===== */
  .cart-bar{
    position:fixed; left:50%; margin-left:-95px; bottom:18px; width:190px;
    background:var(--ink); color:var(--cream); border-radius:999px;
    padding:14px 0; display:none; align-items:center; justify-content:center; gap:10px;
    font-family:'Fraunces',serif; font-weight:600; font-size:14.5px;
    cursor:pointer; box-shadow:0 8px 20px rgba(36,18,32,0.35); z-index:50;
  }
  .cart-bar.show{ display:flex; }
  .cart-badge{
    background:var(--gold); color:var(--ink); border-radius:50%;
    width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center;
    font-size:12px; font-family:'Manrope',sans-serif; font-weight:700;
  }

  /* ===== CART LIST ===== */
  .cart-row{
    background:var(--paper); border-radius:12px; padding:13px 15px; margin-bottom:10px;
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    box-shadow:0 2px 0 var(--line);
  }
  .cart-row .cname{ font-weight:700; font-size:14px; }
  .cart-row .cmeta{ font-size:11.5px; color:var(--muted); font-family:'IBM Plex Mono',monospace; }
  .qty-controls{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .qty-btn{
    width:28px; height:28px; border-radius:50%; border:2px solid var(--panel);
    background:var(--cream); font-size:15px; font-weight:700; cursor:pointer;
  }
  .cart-total{
    display:flex; justify-content:space-between; align-items:center;
    font-family:'Fraunces',serif; font-weight:600; font-size:18px;
    margin:20px 0; padding-top:16px; border-top:2px dashed var(--line);
  }
  .primary-btn{
    width:100%; background:var(--panel); color:var(--cream); border:none; border-radius:12px;
    padding:15px; font-family:'Fraunces',serif; font-weight:600; font-size:16px;
    cursor:pointer; margin-top:8px; min-height:52px;
  }
  .primary-btn:disabled{ opacity:0.6; }
  .empty-msg{ text-align:center; color:var(--muted); font-size:13.5px; padding:34px 0; }

  /* ===== CHECKOUT ===== */
  .checkout-grid{ display:block; }
  @media (min-width:640px){
    .checkout-grid{ display:grid; grid-template-columns:1fr 1fr; column-gap:20px; }
    .checkout-grid .field-full{ grid-column:1 / span 2; }
  }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-weight:700; font-size:12.5px; margin-bottom:6px; color:var(--panel); }
  .field input, .field textarea{
    width:100%; border:2px solid var(--line); border-radius:10px;
    padding:12px 13px; font-family:'Manrope',sans-serif; font-size:16px;
    background:var(--paper); color:var(--ink);
  }
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--panel); }
  .field textarea{ resize:vertical; min-height:70px; }
  .cash-note{
    background:var(--blush); border-radius:10px; padding:13px 15px; font-size:13px;
    color:var(--ink); margin-bottom:18px; font-weight:600;
  }
  .checkout-summary{
    background:var(--paper); border-radius:12px; padding:15px 17px; margin-bottom:18px;
    box-shadow:0 2px 0 var(--line);
  }
  .summary-row{ display:flex; justify-content:space-between; font-size:13.5px; padding:5px 0; color:var(--muted); }
  .summary-row.grand{
    font-family:'Fraunces',serif; font-weight:600; font-size:17px;
    color:var(--ink); border-top:2px dashed var(--line); margin-top:6px; padding-top:10px;
  }

  .confirm-box{ text-align:center; padding:44px 10px; }
  .confirm-ring{
    width:56px; height:56px; border:4px solid var(--gold); border-radius:50%;
    margin:0 auto 18px;
  }
  .confirm-box h2{ font-family:'Fraunces',serif; font-weight:600; font-size:26px; margin-bottom:10px; }
  .confirm-box p{ color:var(--muted); font-size:14px; max-width:340px; margin:0 auto; }
  .confirm-box p.note{ margin-top:8px; }
</style>
</head>

<div class="wrap">

  <div id="nav-anchor"></div>

  <!-- SCREEN 1: Categories + products -->
  <div class="screen active" id="screen-categories">
    <div class="keyring-nav" id="keyring-nav"></div>
    <div class="charm-grid" id="charm-grid"></div>
  </div>

  <!-- SCREEN 2: (kept for structural parity, unused directly — items render inline) -->

  <!-- SCREEN 3: Cart -->
  <div class="screen" id="screen-cart">
    <button class="back-btn" onclick="showScreen('categories')">&larr; Add more charms</button>
    <div class="section-title">Your cart</div>
    <div id="cart-list"></div>
    <div class="cart-total" id="cart-total-row" style="display:none;">
      <span>Subtotal</span><span id="cart-total-amt">0 QR</span>
    </div>
    <button class="primary-btn" id="checkout-btn" style="display:none;" onclick="showScreen('checkout')">Checkout</button>
  </div>

  <!-- SCREEN 4: Checkout -->
  <div class="screen" id="screen-checkout">
    <button class="back-btn" onclick="showScreen('cart')">&larr; Back to cart</button>

    <div class="cash-note">💛 Payment via Fawran — we'll message you the payment details after your order.</div>
    <form name="charmify-order" method="POST" action="https://formspree.io/f/xqpzynwd" id="order-form" onsubmit="submitOrder(event)">
      <input type="hidden" name="_subject" value="New Charmify Order" />
      <div class="checkout-grid">
        <div class="field">
          <label for="cust-name">Your name</label>
          <input type="text" id="cust-name" name="name" required />
        </div>
        <div class="field">
          <label for="cust-phone">Phone number</label>
          <input type="tel" id="cust-phone" name="phone" required />
        </div>
        <div class="field field-full">
          <label for="cust-location">Location / address</label>
          <textarea id="cust-location" name="location" required placeholder="Building, street, area, city..."></textarea>
        </div>
      </div>
      <div class="checkout-summary" id="checkout-summary"></div>
      <input type="hidden" id="order-summary" name="order" />
      <input type="hidden" id="order-subtotal" name="subtotal" />
      <input type="hidden" id="order-shipping" name="shipping" />
      <input type="hidden" id="order-total" name="total" />
      <button class="primary-btn" type="submit">Place order</button>

  var CATEGORIES = [
    {
      id: 'animal',
      name: 'Animal keychains',
      emoji: '🐰',
      options: [
        { name: 'Punch the Monkey keychain', price: 15, img: 'punch_the_monkey' },
        { name: 'Diamond Dolphin', price: 20, img: 'diamond_dolphin' }
      ]
    },
    {
      id: 'chicken',
      name: 'Screaming chicken',
      emoji: '🐔',
      options: [
        { name: 'Classic screaming chicken', price: 15, img: 'screaming_chicken' }
      ]
    },
    {
      id: 'qatari',
      name: 'Qatari keychains',
      emoji: '🦅',
      options: [
        { name: 'Battola', price: 18, img: 'battola' },
        { name: 'Camel', price: 18, img: 'camel' },
        { name: 'Medium palm tree keychain', price: 20, img: 'medium_palm_tree', soldOut: true }
      ]
    },
    {
      id: 'ponies',
      name: 'My Little Pony keychains',
      emoji: '🦄',
      options: [
        { name: 'Pinkie Pie', price: 15, img: 'pinkie_pie' },
        { name: 'Twilight Sparkle', price: 15, img: 'twilight_sparkle' }
      ]
    }
  ];

  var cart = [];
  var activeCategoryId = CATEGORIES[0].id;

  function findCategory(catId){
    for (var i = 0; i < CATEGORIES.length; i++){
      if (CATEGORIES[i].id === catId) return CATEGORIES[i];
    }
    return null;
  }

  function renderKeyringNav(){
    var nav = document.getElementById('keyring-nav');
    nav.innerHTML = '';
    for (var i = 0; i < CATEGORIES.length; i++){
      (function(cat, idx){
        if (idx > 0){
          var link = document.createElement('div');
          link.className = 'key-link';
          nav.appendChild(link);
        }
        var tab = document.createElement('button');
        tab.type = 'button';
        tab.className = 'key-tab' + (cat.id === activeCategoryId ? ' active' : '');
        tab.innerHTML = '<span class="dot">' + cat.emoji + '</span><span class="label">' + cat.name + '</span>';
        tab.addEventListener('click', function(){
          activeCategoryId = cat.id;
          renderKeyringNav();
          renderCharmGrid();
        });
        nav.appendChild(tab);
      })(CATEGORIES[i], i);
    }
  }

  function renderCharmGrid(){
    var cat = findCategory(activeCategoryId);
    var grid = document.getElementById('charm-grid');
    grid.innerHTML = '';
    for (var i = 0; i < cat.options.length; i++){
      (function(opt){
        var card = document.createElement('div');
        card.className = 'charm-card' + (opt.soldOut ? ' sold-out' : '');
        var imgHtml = opt.img && PRODUCT_IMAGES[opt.img]
          ? '<img class="charm-photo" src="' + PRODUCT_IMAGES[opt.img] + '" alt="' + opt.name + '">'
          : '<div class="charm-photo-placeholder">📷</div>';
        var badgeHtml = opt.soldOut ? '<div class="sold-out-badge">Sold out</div>' : '';
        var btnHtml = opt.soldOut
          ? '<button type="button" class="add-btn" disabled>Sold out</button>'
          : '<button type="button" class="add-btn">Add</button>';
        card.innerHTML =
          '<div class="charm-hole"></div>' +
          '<div class="charm-photo-wrap">' + imgHtml + badgeHtml + '</div>' +
          '<div class="charm-name">' + opt.name + '</div>' +
          '<div class="charm-footer">' +
            '<span class="price-tag">' + opt.price + ' QR</span>' +
            btnHtml +
          '</div>';
        if (!opt.soldOut){
          var btn = card.querySelector('.add-btn');
          btn.addEventListener('click', function(){
            addToCart(cat.name, opt.name, opt.price);
            btn.textContent = 'Added';
            btn.classList.add('added');
            setTimeout(function(){
              btn.textContent = 'Add';
              btn.classList.remove('added');
            }, 1200);
          });
        }
        grid.appendChild(card);
      })(cat.options[i]);
    }
  }

  function addToCart(category, name, price){
    var existing = null;
    for (var i = 0; i < cart.length; i++){
      if (cart[i].category === category && cart[i].name === name){ existing = cart[i]; break; }
    }
    if (existing){ existing.qty += 1; }
    else { cart.push({ category: category, name: name, price: price, qty: 1 }); }
    updateCartBar();
  }

  function changeQty(idx, delta){
    cart[idx].qty += delta;
    if (cart[idx].qty <= 0){ cart.splice(idx, 1); }
    renderCart();
    updateCartBar();
  }

  function cartSubtotal(){
    var total = 0;
    for (var i = 0; i < cart.length; i++){ total += cart[i].price * cart[i].qty; }
    return total;
  }

  function updateCartBar(){
    var totalItems = 0;
    for (var i = 0; i < cart.length; i++){ totalItems += cart[i].qty; }
    var bar = document.getElementById('cart-bar');
    document.getElementById('cart-badge').textContent = totalItems;
    if (totalItems > 0){ bar.classList.add('show'); } else { bar.classList.remove('show'); }
  }

  function renderCart(){
    var list = document.getElementById('cart-list');
    var totalRow = document.getElementById('cart-total-row');
    var checkoutBtn = document.getElementById('checkout-btn');
    list.innerHTML = '';
    if (cart.length === 0){
      list.innerHTML = '<div class="empty-msg">Your cart is empty — go pick some charms.</div>';
      totalRow.style.display = 'none';
      checkoutBtn.style.display = 'none';
      return;
    }
    for (var i = 0; i < cart.length; i++){
      (function(item, idx){
        var row = document.createElement('div');
        row.className = 'cart-row';
        row.innerHTML =
          '<div>' +
            '<div class="cname">' + item.name + '</div>' +
            '<div class="cmeta">' + item.category + ' · ' + item.price + ' QR each</div>' +
          '</div>' +
          '<div class="qty-controls">' +
            '<button type="button" class="qty-btn minus">&minus;</button>' +
            '<span>' + item.qty + '</span>' +
            '<button type="button" class="qty-btn plus">+</button>' +
          '</div>';
        row.querySelector('.minus').addEventListener('click', function(){ changeQty(idx, -1); });
        row.querySelector('.plus').addEventListener('click', function(){ changeQty(idx, 1); });
        list.appendChild(row);
      })(cart[i], i);
    }
    document.getElementById('cart-total-amt').textContent = cartSubtotal() + ' QR';
    totalRow.style.display = 'flex';
    checkoutBtn.style.display = 'block';
  }

  function renderCheckoutSummary(){
    var subtotal = cartSubtotal();
    document.getElementById('checkout-summary').innerHTML =
      '<div class="summary-row grand"><span>Items total</span><span>' + subtotal + ' QR</span></div>' +
      '<div class="summary-row" style="margin-top:6px;">Shipping depends on your location — we\'ll message you the cost.</div>';
  }

  function showScreen(name){
    var screens = document.querySelectorAll('.screen');
    for (var i = 0; i < screens.length; i++){ screens[i].classList.remove('active'); }
    document.getElementById('screen-' + name).classList.add('active');
    var hero = document.getElementById('site-hero');
    if (name === 'categories'){ hero.classList.remove('compact'); }
    else { hero.classList.add('compact'); }
    if (name === 'cart'){ renderCart(); }
    if (name === 'checkout'){ renderCheckoutSummary(); }
    window.scrollTo(0, 0);
  }

  function submitOrder(e){
    e.preventDefault();
    var lines = [];
    for (var i = 0; i < cart.length; i++){
      var item = cart[i];
      lines.push(item.qty + 'x ' + item.name + ' (' + item.category + ') - ' + (item.price * item.qty) + ' QR');
    }
    var summary = lines.join(' | ');
    var subtotal = cartSubtotal();

    document.getElementById('order-summary').value = summary;
    document.getElementById('order-subtotal').value = subtotal + ' QR';
    document.getElementById('order-shipping').value = 'Depends on location — to be confirmed';
    document.getElementById('order-total').value = subtotal + ' QR (+ shipping, TBC)';

    var form = document.getElementById('order-form');
    var submitButton = form.querySelector('button[type="submit"]');
    submitButton.disabled = true;
    submitButton.textContent = 'Sending order...';

    var formData = new FormData(form);
    fetch(form.action, {
      method: 'POST',
      body: formData,
      headers: { 'Accept': 'application/json' }
    }).then(function(response){
      if (!response.ok){ throw new Error('Order could not be sent.'); }
      showScreen('confirm');
    }).catch(function(){
      alert('Sorry — the order could not be sent. Please check your internet connection and try again.');
    }).finally(function(){
      submitButton.disabled = false;
      submitButton.textContent = 'Place order';
    });
  }

  function resetAndStart(){
    cart = [];
    document.getElementById('order-form').reset();
    updateCartBar();
    activeCategoryId = CATEGORIES[0].id;
    renderKeyringNav();
    renderCharmGrid();
    showScreen('categories');
  }

  renderKeyringNav();
  renderCharmGrid();
</script>
